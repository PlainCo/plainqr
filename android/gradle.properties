org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
android.useAndroidX=true

# R8 full mode. Already the default from AGP 8.0 and we are on 8.11.1, so this
# is explicit intent rather than a behaviour change -- it pins the setting if a
# future AGP flips the default, and rules R8 out when Play reports optimisation
# recommendations. Requires AGP > 8.5 with Flutter (flutter/flutter#146266).
android.enableR8.fullMode=true
